<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>You're offline — FaceLeb</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #1A4BFF;
      --red:     #EE0000;
      --bg:      #0f0f13;
      --card:    #16161e;
      --border:  #2a2a38;
      --text:    #f0f0f5;
      --muted:   #8888a0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 2rem;
      padding: 3rem 2.5rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }

    .icon-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 80px;
      height: 80px;
      border-radius: 1.5rem;
      background: rgba(26, 75, 255, 0.12);
      margin-bottom: 1.5rem;
    }

    svg.logo { width: 52px; height: 55px; }

    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
    }

    p {
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--primary);
      color: #fff;
      font-size: 0.875rem;
      font-weight: 700;
      padding: 0.75rem 1.75rem;
      border-radius: 9999px;
      border: none;
      cursor: pointer;
      transition: opacity .2s;
      text-decoration: none;
    }
    .btn:hover { opacity: 0.88; }

    .status {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f43f5e;
      margin-right: 0.35rem;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .3; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <svg class="logo" viewBox="0 0 100 106" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <clipPath id="l"><rect x="0" y="0" width="50" height="106"/></clipPath>
          <clipPath id="r"><rect x="50" y="0" width="50" height="106"/></clipPath>
        </defs>
        <g clip-path="url(#l)">
          <path fill="#1A4BFF" d="M 6 101 L 40 81 A 38 38 0 1 0 19 66 Z"/>
          <circle cx="50" cy="44" r="28" fill="white" fill-opacity=".15"/>
        </g>
        <g clip-path="url(#r)">
          <path fill="#EE0000" d="M 6 101 L 40 81 A 38 38 0 1 0 19 66 Z"/>
          <circle cx="50" cy="44" r="28" fill="white" fill-opacity=".15"/>
        </g>
        <text x="22" y="62" font-family="Arial Black,sans-serif" font-weight="900" font-size="28" fill="#1A4BFF">F</text>
        <text x="51" y="62" font-family="Arial Black,sans-serif" font-weight="900" font-size="28" fill="#EE0000">L</text>
      </svg>
    </div>

    <h1>You're offline</h1>
    <p>
      FaceLeb can't reach the internet right now.<br>
      Check your connection and try again.
    </p>

    <button class="btn" onclick="window.location.reload()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
        <path d="M21 3v5h-5"/>
        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
        <path d="M3 21v-5h5"/>
      </svg>
      Try again
    </button>

    <p class="status">
      <span class="dot"></span> No connection detected
    </p>
  </div>

  <script>
    window.addEventListener("online", () => window.location.reload());
  </script>
</body>
</html>
